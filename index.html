<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#11185a" />
    <title>CIS Dispatch</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/splash-screen.png" media="(max-aspect-ratio: 4/3)" />
    <link rel="preload" as="image" href="/splash-landscape.png" media="(min-aspect-ratio: 4/3)" />
    <style>
      html,body{margin:0;background:#0059fa;}
      .app-splash{position:fixed;inset:0;z-index:1000;overflow:hidden;background:#0059fa;}
      .app-splash picture,.app-splash img{display:block;width:100%;height:100%;}
      .app-splash img{object-fit:cover;object-position:50% 50%;}
      @media(min-aspect-ratio:4/3){.app-splash img{object-position:30% 50%;}}
    </style>
  </head>
  <body>
    <div id="root"><div class="app-splash" role="status" aria-label="Loading CIS Dispatch"><picture><source media="(min-aspect-ratio: 4/3)" srcset="/splash-landscape.png" /><img src="/splash-screen.png" width="941" height="1672" alt="CIS Dispatch splash" /></picture></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
